# Internal nginx for the website container: serves Laravel's public/ and
# forwards PHP to php-fpm on 127.0.0.1:9000. TLS is handled by the front nginx.
server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 16m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
    }

    # Cache static assets aggressively (Vite fingerprints filenames).
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
